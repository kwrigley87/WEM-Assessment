<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>WEM Maturity Snapshot | Genesys</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">Genesys</span>
        <span class="brand-divider"></span>
        <span class="brand-sub">WEM Maturity Snapshot</span>
      </div>
      <div class="progress-track" id="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </header>

    <main id="app" class="app-main"></main>

    <footer class="app-footer">
      <span>Genesys Professional Services — Workforce Engagement Management</span>
    </footer>
  </div>

  <!-- jsPDF for client-side PDF generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <!-- Chart.js for the maturity radar/spider chart -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <!-- EmailJS (optional; only used if enabled in js/config.js) -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/leads.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/email.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
